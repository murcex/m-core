<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyudro Portal - Dynamic Element</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-image: url('background.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: courier;
        }

        .container {
            background-color: white;
            padding: 2em;
            border: 1px solid black;
            text-align: center;
            color: black;
        }

        button {
            padding: 0.6em 1.2em;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
    <script>
        function openURL() {
            var url = 'WEBSITE_HOSTNAME/api/Portal?page=test-index&session-token=dym-token';
            window.location.href = url;
        }
    </script>
</head>

<body>
    <div class="container">
        <h2 style="text-align: center;">Dynamic Element</h2>
        <p style="text-align: left;">
            This element is generated by custom C# logic each time a request is handled.<br>
            It allows responses to reflect real-time inputs or contextual data, making the content dynamic.<br>
        </p>
        <p style="text-align: left;">
            Here is an example of a dynamic element: dym-guid-value<br>
        </p>
        <br>
        <a href="WEBSITE_HOSTNAME/api/Portal?page=test-index&session-token=dym-token">
            <img src="home.png" alt="Home" width="32" height="32" style="cursor: pointer; border: none;">
        </a>
    </div>
</body>

</html>
