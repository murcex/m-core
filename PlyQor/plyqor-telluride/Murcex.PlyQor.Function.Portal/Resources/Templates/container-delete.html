<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PlyQor - Delete Container</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Courier', monospace;
      background: url('background.jpg') center center / cover no-repeat fixed;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .top-left-icon {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .index-image {
      width: 64px;
      height: 64px;
      cursor: pointer;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .upload-row {
      margin-bottom: 20px;
    }

    .upload-image {
      width: 64px;
      height: 64px;
      cursor: pointer;
    }

    .textbox-wrapper {
      width: 700px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    input[type="text"] {
      height: 40px;
      width: 100%;
      font-size: 16px;
      padding: 5px;
      text-align: center;
      border: 1px solid black;
      font-family: 'Courier', monospace;
      background-color: white;
    }
  </style>
</head>
<body>
  <div class="top-left-icon">
    <a href="WEBSITE_HOSTNAME/api/Portal?page=plyqor-index&session-token=dym-token">
      <img src="index.png" alt="Home" class="index-image" title="Home">
    </a>
  </div>

  <div class="main-container">
    <div class="upload-row">
      <img src="upload.png" alt="Upload" class="upload-image" title="Upload" id="upload-img">
    </div>

    <div class="textbox-wrapper">
      <input type="text" id="box1" value="dym-container" readonly>
      <input type="text" id="box2" placeholder='"delete" to confirm' autocomplete="off">
    </div>
  </div>

  <script>
    document.getElementById('upload-img').addEventListener('click', function() {
      const container = encodeURIComponent(document.getElementById('box1').value);
      const confirm = encodeURIComponent(document.getElementById('box2').value);
        const url = `WEBSITE_HOSTNAME/api/Portal?page=container-operation&operation=delete&session-token=dym-token&container=${container}&confirm=${confirm}`;
      window.location.href = url;
    });
  </script>
</body>
</html>
