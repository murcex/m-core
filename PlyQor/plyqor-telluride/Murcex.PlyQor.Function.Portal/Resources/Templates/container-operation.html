<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PlyQor - Container Result</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Courier', monospace;
      background: url('background.jpg') center center / cover no-repeat fixed;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .top-left-icon {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .index-image {
      width: 64px;
      height: 64px;
      cursor: pointer;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .result-row {
      margin-bottom: 20px;
    }

    .result-image {
      width: 64px;
      height: 64px;
      cursor: pointer;
    }

    .textbox-wrapper {
      width: 700px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    input[type="text"] {
      height: 40px;
      width: 100%;
      font-size: 16px;
      padding: 5px;
      text-align: center;
      border: 1px solid black;
      font-family: 'Courier', monospace;
      background-color: white;
    }
  </style>
</head>
<body>
  <div class="top-left-icon">
    <a href="WEBSITE_HOSTNAME/api/Portal?page=plyqor-index&session-token=dym-token">
      <img src="index.png" alt="Home" class="index-image" title="Home">
    </a>
  </div>

  <div class="main-container">
    <div class="result-row">
      <img src="result.png" alt="Result" class="result-image" title="Result">
    </div>

    <div class="textbox-wrapper">
      <input type="text" id="box1" value="dym-message" readonly>
    </div>
  </div>
</body>
</html>
