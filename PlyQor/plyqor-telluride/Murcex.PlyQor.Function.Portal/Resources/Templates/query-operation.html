<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PlyQor - Query Operation</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Courier', monospace;
            background: url('background.jpg') center center / cover no-repeat fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-left-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .index-image {
            width: 64px;
            height: 64px;
            cursor: pointer;
        }

        .download-row {
            margin-bottom: 20px;
        }

        .download-image {
            width: 64px;
            height: 64px;
            cursor: pointer;
        }

        .main-container {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .textbox-wrapper {
            width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        input[type="text"] {
            height: 40px;
            width: 100%;
            font-size: 16px;
            padding: 5px;
            text-align: center;
            border: 1px solid black;
            font-family: 'Courier', monospace;
            background-color: white;
        }

        textarea.data-box {
            width: 100%;
            height: 300px; /* taller to accommodate large results */
            font-size: 14px;
            padding: 10px;
            font-family: 'Courier', monospace;
            border: 1px solid black;
            resize: vertical;
            overflow: auto;
            white-space: pre-wrap;
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="top-left-icon">
        <a href="WEBSITE_HOSTNAME/api/Portal?page=query-list&session-token=dym-token&container=dym-container">
            <img src="index.png" alt="Home" class="index-image" title="Home">
        </a>
    </div>

    <div class="main-container">
        <div class="download-row">
            <img src="download.png" alt="Download" class="download-image" title="Download" id="download-img">
        </div>

        <div class="textbox-wrapper">
            <input type="text" id="box1" value="dym-container" readonly>
            <textarea id="box2" readonly class="data-box">dym-query-data</textarea>
        </div>
    </div>
    
</body>
</html>
